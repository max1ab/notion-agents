[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-agent-server"
version = "0.1.0"
description = "Notion board worker for local Codex and Claude Code"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
notion-agent = "notion_agent.cli:main"

[tool.setuptools.packages.find]
include = ["notion_agent*"]
